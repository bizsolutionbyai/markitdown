name: Validate Sobiz Claude plugin
on:
  pull_request:
    paths:
      - '.claude-plugin/**'
      - 'plugins/sobiz-markitdown/**'
      - '.github/workflows/sobiz-plugin-validate.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON and plugin layout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          marketplace = json.loads(Path('.claude-plugin/marketplace.json').read_text())
          assert marketplace['name'] == 'sobiz-marketplace'
          for item in marketplace['plugins']:
              root = Path(item['source'])
              manifest = json.loads((root / '.claude-plugin/plugin.json').read_text())
              assert manifest['name'] == item['name']
              mcp = json.loads((root / '.mcp.json').read_text())
              assert mcp['mcpServers']['markitdown']['command'] == 'uvx'
              assert (root / 'skills/convert-document/SKILL.md').is_file()
          print('Sobiz plugin structure valid')
          PY
